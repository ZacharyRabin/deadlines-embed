<!doctype html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:#191919;overflow:hidden}
  .crop{position:relative;width:100%;height:100%;overflow:hidden}
  iframe{
    position:absolute; left:0; top:-140px;            /* shift to the part you want */
    width:166.7%; height:calc(166.7% + 300px);        /* = 1 / 0.6 of the box */
    border:0; transform:scale(1); transform-origin:0 0;
    filter:invert(.92) hue-rotate(180deg) contrast(.9);
  }
</style></head><body>
<div class="crop">
  <iframe src="https://mlciv.com/ai-deadlines/?sub=ML,CV,SP,DM"></iframe>
</div></body></html>
