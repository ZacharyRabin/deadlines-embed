<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banner</title>
<style>
  :root {
    --bg: #191919;
    --fg: #e6e6e6;
    --muted: #9aa0a6;
    --line: #2c2c2c;
    --accent: #60a5fa;
  }
  /* Override with ?theme=light or ?theme=dark */
  html[data-theme="light"] { --bg: #ffffff; --fg: #1f2328; --muted: #6b7280; --line: #e5e7eb; }
  html[data-theme="dark"]  { --bg: #191919; --fg: #e6e6e6; --muted: #9aa0a6; --line: #2c2c2c; }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  button { font: inherit; color: inherit; cursor: pointer; }

  .banner {
    height: 100%; display: flex; align-items: stretch;
    font-size: clamp(14px, 4.2vmin, 40px);
  }
  .panel { display: flex; flex-direction: column; justify-content: center; min-width: 0; }
  .panel + .panel { border-left: 1px solid var(--line); }

  /* ---------- clock (unchanged from clock/index.html) ---------- */
  .clock { flex: 0 0 auto; align-items: center; text-align: center; gap: 0.15em; padding: 8px 1.6em; }
  .weekday {
    font-size: 1.1em; font-weight: 600; letter-spacing: 0.22em;
    text-transform: uppercase; color: var(--accent);
  }
  .time {
    font-size: 3.6em; font-weight: 300; line-height: 1;
    font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
  }
  .time .sec { font-size: 0.45em; color: var(--muted); margin-left: 0.15em; }
  .time .ampm { font-size: 0.35em; color: var(--muted); margin-left: 0.3em; letter-spacing: 0.1em; }
  .date { font-size: 1.2em; color: var(--muted); margin-top: 0.2em; }
  .rule { width: 2.5em; height: 2px; background: var(--accent); border-radius: 2px; margin: 0.5em 0 0.3em; opacity: 0.7; }

  /* ---------- weather ---------- */
  .weather { flex: 1 1 auto; flex-direction: row; align-items: center; justify-content: space-around; gap: 1em; padding: 8px 1.2em; }
  .city { text-align: center; line-height: 1.25; }
  .cname { font-size: 0.72em; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }
  .now { display: flex; align-items: center; justify-content: center; gap: 0.25em; margin: 0.15em 0; }
  .wi { font-size: 1.7em; line-height: 1; }
  .deg { font-size: 2.3em; font-weight: 300; line-height: 1; font-variant-numeric: tabular-nums; }
  .cond { font-size: 0.85em; color: var(--fg); }
  .meta { font-size: 0.75em; color: var(--muted); font-variant-numeric: tabular-nums; }
  .wmsg { color: var(--muted); font-size: 0.85em; }

  /* ---------- pomodoro ---------- */
  .pomo { flex: 0 0 auto; align-items: center; gap: 0.35em; padding: 8px 1.5em; }
  .tabs { display: flex; gap: 0.3em; }
  .tabs button {
    background: transparent; border: 1px solid transparent; border-radius: 999px;
    padding: 0.05em 0.6em; font-size: 0.72em; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);
  }
  .tabs button.on { color: var(--accent); border-color: var(--accent); }
  .ptime { font-size: 2.5em; font-weight: 300; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .bar { width: 100%; height: 3px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.25s linear; }
  .ctrl { display: flex; align-items: center; gap: 0.5em; }
  .ctrl button {
    width: 1.9em; height: 1.9em; border-radius: 50%; border: 1px solid var(--line); background: transparent;
    display: grid; place-items: center; padding: 0; font-size: 0.85em; line-height: 1;
  }
  .ctrl button:hover { border-color: var(--muted); }
  .ctrl button.main { width: 2.3em; height: 2.3em; background: var(--accent); border-color: transparent; color: #141414; }
  .pmeta { display: flex; align-items: center; gap: 0.7em; font-size: 0.72em; color: var(--muted); }
  .dot { display: inline-block; width: 0.55em; height: 0.55em; border-radius: 50%; border: 1px solid var(--muted); margin-right: 0.25em; }
  .dot.on { background: var(--accent); border-color: var(--accent); }

  @media (max-width: 820px) {
    .banner { flex-direction: column; height: auto; min-height: 100%; }
    .panel + .panel { border-left: 0; border-top: 1px solid var(--line); }
    .weather { padding: 1em; }
  }
</style>
</head>
<body>
<div class="banner">

  <div class="panel clock">
    <div class="weekday" id="weekday"></div>
    <div class="time" id="time"></div>
    <div class="rule"></div>
    <div class="date" id="date"></div>
  </div>

  <div class="panel weather" id="weather"><span class="wmsg">Loading weather…</span></div>

  <div class="panel pomo">
    <div class="tabs" id="tabs">
      <button data-m="focus">Focus</button>
      <button data-m="short">Break</button>
      <button data-m="long">Long</button>
    </div>
    <div class="ptime" id="ptime">25:00</div>
    <div class="bar"><i id="pbar"></i></div>
    <div class="ctrl">
      <button id="reset" title="Reset">&#x21BA;</button>
      <button id="play" class="main" title="Start / pause">&#x25B6;&#xFE0E;</button>
      <button id="skip" title="Skip">&raquo;</button>
    </div>
    <div class="pmeta"><span id="dots"></span><span id="ptoday"></span></div>
  </div>

</div>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var store = {
    get: function (k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  // Options via URL, e.g. ?h24=1&seconds=1&tz=America/New_York&theme=light
  var q = new URLSearchParams(location.search);
  var tz = q.get("tz") || undefined;
  var h24 = q.get("h24") === "1";
  var showSec = q.get("seconds") === "1";
  if (q.get("theme")) document.documentElement.dataset.theme = q.get("theme");

  /* ================= clock ================= */
  var COLORS = [
    ["#dc2626", "#f87171"], // Sun red
    ["#2563eb", "#60a5fa"], // Mon blue
    ["#ea580c", "#fb923c"], // Tue orange
    ["#16a34a", "#4ade80"], // Wed green
    ["#9333ea", "#c084fc"], // Thu purple
    ["#db2777", "#f472b6"], // Fri pink
    ["#0d9488", "#2dd4bf"]  // Sat teal
  ];
  function applyColor(day) {
    var dark = document.documentElement.dataset.theme !== "light";
    document.documentElement.style.setProperty("--accent", COLORS[day][dark ? 1 : 0]);
  }
  var DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  var fWeekday = new Intl.DateTimeFormat(undefined, { weekday: "long", timeZone: tz });
  var fDate = new Intl.DateTimeFormat(undefined, { month: "long", day: "numeric", year: "numeric", timeZone: tz });
  var fHM = new Intl.DateTimeFormat("en-US", { hour: h24 ? "2-digit" : "numeric", minute: "2-digit", hour12: !h24, hourCycle: h24 ? "h23" : "h12", timeZone: tz });
  var fSec = new Intl.DateTimeFormat("en-US", { second: "2-digit", timeZone: tz });

  function clockTick() {
    var now = new Date();
    var hm = "", ap = "";
    fHM.formatToParts(now).forEach(function (p) {
      if (p.type === "dayPeriod") ap = p.value;
      else if (p.type === "hour" || p.type === "minute" || p.type === "literal") hm += p.value;
    });
    var sec = tz ? fSec.format(now).padStart(2, "0") : String(now.getSeconds()).padStart(2, "0");
    $("time").innerHTML =
      hm.trim() + (showSec ? '<span class="sec">' + sec + "</span>" : "") +
      (ap ? '<span class="ampm">' + ap + "</span>" : "");
    var wd = fWeekday.format(now);
    $("weekday").textContent = wd;
    $("date").textContent = fDate.format(now);
    var idx = DAYS.indexOf(wd);
    if (idx >= 0) applyColor(idx);
  }
  clockTick();
  setInterval(clockTick, showSec ? 1000 : 5000);

  /* ================= weather (Open-Meteo, no key) ================= */
  var CITIES = [
    { name: "Columbus, OH",   lat: 39.9612, lon: -82.9988 },
    { name: "Clarksburg, MD", lat: 39.2389, lon: -77.2794 }
  ];
  var WX_TTL = 15 * 60 * 1000;

  function wmo(code, isDay) {
    if (code === 0) return isDay ? ["☀️", "Clear"] : ["🌙", "Clear"];
    if (code === 1) return isDay ? ["🌤️", "Mostly clear"] : ["🌙", "Mostly clear"];
    if (code === 2) return ["⛅", "Partly cloudy"];
    if (code === 3) return ["☁️", "Overcast"];
    if (code === 45 || code === 48) return ["🌫️", "Fog"];
    if (code >= 51 && code <= 57) return ["🌦️", "Drizzle"];
    if (code >= 61 && code <= 67) return ["🌧️", "Rain"];
    if (code >= 71 && code <= 77) return ["🌨️", "Snow"];
    if (code >= 80 && code <= 82) return ["🌦️", "Showers"];
    if (code === 85 || code === 86) return ["🌨️", "Snow showers"];
    if (code >= 95) return ["⛈️", "Thunderstorm"];
    return ["🌡️", ""];
  }
  function deg(n) { return (n === null || n === undefined) ? "—" : Math.round(n) + "°"; }

  function renderWeather(list) {
    var html = "";
    list.forEach(function (d, i) {
      var cur = d.current || {}, day = d.daily || {};
      var w = wmo(cur.weather_code, cur.is_day);
      var pop = day.precipitation_probability_max ? day.precipitation_probability_max[0] : null;
      html += '<div class="city">' +
        '<div class="cname">' + CITIES[i].name + "</div>" +
        '<div class="now"><span class="wi">' + w[0] + '</span><span class="deg">' + deg(cur.temperature_2m) + "</span></div>" +
        '<div class="cond">' + w[1] + "&nbsp;</div>" +
        '<div class="meta">H ' + deg(day.temperature_2m_max && day.temperature_2m_max[0]) +
        " &middot; L " + deg(day.temperature_2m_min && day.temperature_2m_min[0]) +
        " &middot; 💧 " + (pop === null || pop === undefined ? "—" : pop + "%") + "</div>" +
        "</div>";
    });
    $("weather").innerHTML = html;
  }

  function loadWeather() {
    var cached = store.get("bnrWx");
    if (cached && cached.data) renderWeather(cached.data);
    if (cached && Date.now() - cached.t < WX_TTL) return;
    var url = "https://api.open-meteo.com/v1/forecast" +
      "?latitude=" + CITIES.map(function (c) { return c.lat; }).join(",") +
      "&longitude=" + CITIES.map(function (c) { return c.lon; }).join(",") +
      "&current=temperature_2m,weather_code,is_day" +
      "&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max" +
      "&temperature_unit=fahrenheit&timezone=auto&forecast_days=1";
    fetch(url).then(function (r) { return r.json(); }).then(function (d) {
      var list = Array.isArray(d) ? d : [d];
      if (list.length !== CITIES.length) throw new Error("bad response");
      store.set("bnrWx", { t: Date.now(), data: list });
      renderWeather(list);
    }).catch(function () {
      if (!(cached && cached.data)) $("weather").innerHTML = '<span class="wmsg">Weather unavailable</span>';
    });
  }
  loadWeather();
  setInterval(loadWeather, WX_TTL);

  /* ================= pomodoro ================= */
  var CFG = { focus: 25, short: 5, long: 15 };
  var MODES = { focus: "👓", short: "☕", long: "🌴" };
  var todayKey = function () { return new Date().toDateString(); };
  var stats = store.get("bnrPomoStats") || {};
  if (stats.day !== todayKey()) stats = { day: todayKey(), done: 0, cycle: 0 };

  var mode = "focus", running = false, endAt = 0, remaining = CFG.focus * 60;
  var total = function () { return CFG[mode] * 60; };

  // State is kept in localStorage and window.name (survives an iframe reload even when storage is blocked)
  function persist() {
    var o = { mode: mode, running: running, endAt: endAt, remaining: remaining, t: Date.now() };
    store.set("bnrPomo", o);
    try { window.name = "bnr:" + JSON.stringify(o); } catch (e) {}
  }
  function restore() {
    var c = [store.get("bnrPomo")];
    try { if (String(window.name).indexOf("bnr:") === 0) c.push(JSON.parse(window.name.slice(4))); } catch (e) {}
    c = c.filter(function (o) { return o && MODES[o.mode]; })
         .sort(function (a, b) { return (b.t || 0) - (a.t || 0); });
    return c[0] || null;
  }

  var ac;
  function beep() {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      ac.resume();
      [0, 0.22, 0.44].forEach(function (d, i) {
        var o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + d;
        o.frequency.value = i === 2 ? 880 : 660; o.connect(g); g.connect(ac.destination);
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
        o.start(t); o.stop(t + 0.22);
      });
    } catch (e) {}
  }

  function fmt(s) {
    s = Math.ceil(s);
    return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
  }
  function render() {
    var filled = mode === "long" ? 4 : stats.cycle % 4, dots = "";
    for (var i = 0; i < 4; i++) dots += '<span class="dot' + (i < filled ? " on" : "") + '"></span>';
    $("dots").innerHTML = dots;
    $("ptime").textContent = fmt(remaining);
    $("pbar").style.width = (100 * (1 - remaining / total())) + "%";
    $("play").innerHTML = running ? "&#x275A;&#x275A;" : "&#x25B6;&#xFE0E;";
    $("ptoday").textContent = stats.done + " " + MODES.focus + " today";
    Array.prototype.forEach.call($("tabs").children, function (b) { b.classList.toggle("on", b.dataset.m === mode); });
    document.title = running ? fmt(remaining) + " " + MODES[mode] : "Banner";
  }
  function nextMode() {
    if (mode !== "focus") return "focus";
    return stats.cycle % 4 === 0 ? "long" : "short";
  }
  function dayRoll() {
    if (stats.day !== todayKey()) stats = { day: todayKey(), done: 0, cycle: 0 };
  }
  function go(m) { mode = m; running = false; remaining = total(); persist(); render(); }
  function start() {
    if (remaining <= 0) remaining = total();
    endAt = Date.now() + remaining * 1000; running = true;
    try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); ac.resume(); } catch (e) {}
    persist(); render();
  }
  function pause() { remaining = Math.max(0, (endAt - Date.now()) / 1000); running = false; persist(); render(); }
  function finish(silent) {
    dayRoll();
    if (mode === "focus") { stats.done++; stats.cycle++; }
    store.set("bnrPomoStats", stats);
    if (!silent) beep();
    go(nextMode());
  }
  function skip() {
    dayRoll();
    if (mode === "focus") { stats.cycle++; store.set("bnrPomoStats", stats); }
    go(nextMode());
  }

  $("play").onclick = function () { running ? pause() : start(); };
  $("reset").onclick = function () { running = false; remaining = total(); persist(); render(); };
  $("skip").onclick = skip;
  $("tabs").onclick = function (e) { var m = e.target.dataset && e.target.dataset.m; if (m) go(m); };

  var saved = restore();
  if (saved) {
    mode = saved.mode;
    remaining = saved.remaining;
    if (saved.running) {
      if (saved.endAt <= Date.now()) finish(true);   // finished while the page was away
      else { running = true; endAt = saved.endAt; }
    }
  }
  render();
  setInterval(function () {
    if (!running) return;
    remaining = Math.max(0, (endAt - Date.now()) / 1000);
    if (remaining <= 0) finish(false); else render();
  }, 250);
})();
</script>
</body>
</html>
